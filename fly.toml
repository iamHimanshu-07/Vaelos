# fly.toml – Fly.io application configuration
app = "vaelos"          # <-- choose a unique name for your app

kill_signal = "SIGINT"
kill_timeout = 5

# ---- Build ---------------------------------------------------------------
[build]
  # Use the Dockerfile you already have
  dockerfile = "Dockerfile"

# ---- Deploy --------------------------------------------------------------
[deploy]
  # You can enable a release strategy if you like
  strategy = "rolling"

# ---- Environment ---------------------------------------------------------
[env]
  # Example secrets – you’ll set the real values with `fly secrets set`
  # (or put them here if you prefer; secrets are safer)
  JWT_SECRET = ""          # will be overridden by a secret
  OWNER_EMAIL = "itshmanshu666@gmail.com"
  # RESEND_API_KEY = ""   # uncomment if you want to use Resend for notifications

# ---- Services (how traffic reaches your VM) -------------------------------
[[services]]
  internal_port = 8080          # the port your app listens on (process.env.PORT)
  protocol = "tcp"

  # Auto‑halt machines when no traffic (free tier friendly)
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80          # HTTP
    handlers = ["http"]
    # force HTTPS if you like (Fly provides TLS termination)
    # force_https = true

  [[services.ports]]
    port = 443         # HTTPS
    handlers = ["tls", "http"]

  # Optional health check – uses the /healthz endpoint you already have
  [services.health_check]
    grace_period = "5s"
    interval = "15s"
    restart_limit = 0

# ---- Persistent volume for SQLite ----------------------------------------
[mounts]
  source = "vaelos_data"   # name of the volume (will be created if missing)
  destination = "/data"    # matches the Dockerfile's VAELOS_DB default